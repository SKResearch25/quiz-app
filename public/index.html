<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Carlito:wght@700&display=swap" rel="stylesheet"><title>Piramal Vaikunth Quiz League</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1c2033;--m:#6b7089;--a:#4f46e5;--b:#e2e4ee}
@media(prefers-color-scheme:dark){:root{--bg:#12131a;--c:#1c1e2a;--t:#eceef7;--m:#9a9fb8;--b:#2e3146}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px}
input,select,textarea{width:100%;padding:11px;margin:5px 0 10px;border:1px solid var(--b);border-radius:9px;background:var(--bg);color:var(--t);font:inherit}
button{background:var(--a);color:#fff;border:0;border-radius:9px;padding:11px 18px;font:inherit;cursor:pointer;margin:2px}
button.s{background:var(--m)}button.d{background:#dc2626}button.g{background:#16a34a}
img,video{max-width:100%;border-radius:10px;margin:8px 0}
label.o{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--b);border-radius:9px;margin:6px 0;cursor:pointer}
label.o input{width:auto;margin:0}
#timer{position:sticky;top:0;background:var(--a);color:#fff;text-align:center;padding:10px;font-size:20px;font-weight:600;z-index:5}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--b);text-align:left}
.e{color:#dc2626}.m{color:var(--m);font-size:14px}.tw{overflow-x:auto}

body.q{--bg:#e8f6f3;--c:#fff;--t:#1c2a33;--m:#5b6b75;--b:#d5e4e1;--a:#f59e0b;background:linear-gradient(#0b1f3a,#0d3b4f 55%,#0b3d33);background-attachment:fixed;min-height:100vh}
body.q button{color:#2b1d00;font-weight:700}body.q button.s{background:#64748b;color:#fff}body.q button.g{background:#16a34a;color:#fff}
body.q #timer{color:#2b1d00}button:disabled{opacity:.35;cursor:default}
.hero{text-align:center;padding:22px 6px 6px}.hero h1{font-size:34px;margin:6px 0;line-height:1.1}.hero h1 span{color:#f5b301}
.hero p{color:var(--m);margin:6px 0 14px}
.ic{display:flex;justify-content:center;gap:14px;font-size:44px;margin:8px 0}
.ic i{font-style:normal;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px #0006)}
.ic i:nth-child(2){animation-delay:.5s}.ic i:nth-child(3){animation-delay:1s}.ic i:nth-child(4){animation-delay:1.5s}
@keyframes fl{50%{transform:translateY(-10px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px}
.chips b{background:#ffffff14;border:1px solid var(--b);border-radius:20px;padding:6px 12px;font-size:14px;font-weight:500}
.trophy{font-size:64px;text-align:center}
.bar{height:8px;background:var(--b);border-radius:6px;margin:8px 0 12px}.bar i{display:block;height:100%;background:#f5b301;border-radius:6px;transition:width .3s}
.nav{display:flex;justify-content:space-between;margin-top:10px}
.hero p,.chips b{color:#fff}.chips b{background:#ffffff26;border-color:#ffffff66}
.tree{position:relative;max-width:420px;margin:0 auto}.tree svg{width:100%;display:block}
.ttl{position:absolute;left:0;right:0;top:14%;text-align:center;margin:0}
.ttl small{display:block;color:#ffe08a;font-size:clamp(14px,4.5vw,20px);letter-spacing:1px;font-weight:700}
.ttl span{display:block;color:#fff;font-size:clamp(26px,8.5vw,40px);font-weight:800;line-height:1;text-shadow:0 2px 0 #1b6b2d}
.fb{position:absolute;display:flex;flex-direction:column;align-items:center;animation:fl 3s ease-in-out infinite;--s:clamp(46px,13.5vw,60px)}
.fb b{width:var(--s);height:var(--s);border-radius:50%;background:#fff;border:3px solid #ffd43b;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)*.52);box-shadow:0 5px 12px #0004}
.fb small{margin-top:3px;font-size:clamp(9px,2.7vw,11px);font-weight:800;color:#fff;background:#0b5d4acc;border-radius:8px;padding:1px 6px;white-space:nowrap}
.hd{background:#102a43;border:3px solid #ffd43b;border-radius:18px;padding:12px 8px 10px;text-align:center;box-shadow:0 6px 0 #0b1f33,0 10px 20px #0004}
.hd small,.hd span{font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-weight:700!important}.hd small{display:block;color:#ffd43b;font-size:clamp(17px,5.4vw,24px);font-weight:900;letter-spacing:3px;text-transform:uppercase}
.hd span{display:block;color:#fff;font-size:clamp(34px,11.5vw,52px);font-weight:900;line-height:1;letter-spacing:1px;text-transform:uppercase;text-shadow:0 3px 0 #2f9e44}
.tg{text-align:center;color:#fff;font-weight:700;margin:10px 0 0;font-size:14px}
.bub{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 1.5%;margin:12px 0 4px}
.bub .fb{position:static;width:18.5%;--s:clamp(42px,12.5vw,56px)}
.bub .fb small{font-size:clamp(8.5px,2.5vw,10.5px);padding:1px 4px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cmp{padding:14px}.cmp input{margin:4px 0 8px}.cmp h3{margin:0 0 4px;font-size:16px}
.hd{position:relative;overflow:hidden;margin:6px 6px 10px;padding:12px 42px 10px;background:radial-gradient(circle at 18% 0,#6d4cff 0,transparent 55%),radial-gradient(circle at 90% 100%,#0ea5e9 0,transparent 50%),linear-gradient(135deg,#1b1464,#0d47a1);outline:2px solid #ffd43b99;outline-offset:4px;box-shadow:0 0 24px #ffd43b55,0 8px 0 #0b1f33}
.hd::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#ffffff3d,transparent);animation:sh 4.5s ease-in-out infinite}
@keyframes sh{60%,100%{left:140%}}@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.hd small{display:flex;align-items:center;gap:8px;color:#fff;font-size:clamp(14px,4.6vw,20px);letter-spacing:2px}
.hd small::before,.hd small::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#ffd43b)}
.hd small::after{transform:scaleX(-1)}
.hd span{margin-top:2px;background:linear-gradient(#fff7c4,#ffd43b 55%,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 #5c3500)}
.hd i{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-size:30px;z-index:1;filter:drop-shadow(0 3px 4px #0006)}
.hd i.l{left:8px}.hd i.r{right:8px}
.hd u{position:absolute;text-decoration:none;color:#ffe58a;font-size:12px;animation:tw 2s ease-in-out infinite}
body.q{--bg:#0a1430b3;--c:#ffffff12;--t:#f3f6ff;--m:#b8c4d6;--b:#ffffff30;
background:radial-gradient(circle at 12% 8%,#4a2fb066,transparent 42%),radial-gradient(circle at 90% 35%,#0ea5e955,transparent 42%),radial-gradient(circle at 20% 95%,#10b98144,transparent 40%),
radial-gradient(#ffffff66 1px,transparent 1.6px) 0 0/80px 80px,radial-gradient(#ffd43b77 1px,transparent 1.6px) 40px 40px/80px 80px,linear-gradient(#0b1f3a,#0d2d4f 55%,#0b3a3a);background-attachment:fixed}
body.q .card{background:linear-gradient(160deg,#ffffff1c,#ffffff08);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid #ffd43b66;border-radius:18px;box-shadow:0 0 22px #ffd43b22,0 12px 30px #0006}
body.q .cmp h3{color:#ffd43b;font-size:17px;letter-spacing:.5px}body.q .cmp h3::before{content:"✨ "}
body.q input,body.q textarea{border:1px solid #ffffff3d;color:#fff;border-radius:11px}
body.q input::placeholder{color:#9fb0c8}
body.q input:focus{outline:none;border-color:#ffd43b;box-shadow:0 0 0 3px #ffd43b33}
body.q button:not(.s):not(.g){background:linear-gradient(#ffe066,#f59e0b);box-shadow:0 5px 0 #a15c00;border-radius:12px}
body.q button:not(.s):not(.g):active{transform:translateY(3px);box-shadow:0 2px 0 #a15c00}
body.q button.g{box-shadow:0 5px 0 #0d6b2f;border-radius:12px}body.q button.s{box-shadow:0 5px 0 #3d4a5c;border-radius:12px}
body.q label.o{background:#ffffff0d;border-radius:12px;transition:.15s}
body.q label.o:has(input:checked){border-color:#ffd43b;background:#ffd43b24;box-shadow:0 0 0 2px #ffd43b55}
body.q #timer{background:linear-gradient(90deg,#f59e0b,#ffd43b,#f59e0b);box-shadow:0 4px 14px #0006}
body.q .bar{background:#ffffff26}
body.q .e{color:#ff8787}
</style></head><body><div id="timer" hidden></div><main id="app"></main>
<script>
/* ===== EDIT YOUR TEXT HERE ===== */
const TXT={title1:"Piramal Vaikunth",title2:"Quiz League",tagline:"⏱ You get 10 minutes",
 badges:["⏱ 10 minutes","🧠 Brain teasers","🥇 Ranked by score & speed"],formTitle:"Enter your details",button:"Start Quiz 🚀"};
/* ================================ */
const app=document.getElementById("app"),tm=document.getElementById("timer");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,o={},adm)=>{const r=await fetch("/api/"+p,{...o,headers:{"content-type":"application/json",...(adm?{"x-admin":sessionStorage.pw||""}:{})}});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Error");return d};
const post=(p,b,adm)=>api(p,{method:"POST",body:JSON.stringify(b)},adm);
const mmss=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const media=q=>!q.mediaId?"":q.mediaType==="video"?`<video controls playsinline src="/api/media/${q.mediaId}"></video>`:`<img src="/api/media/${q.mediaId}">`;

function route(){tm.hidden=true;const a=location.hash==="#admin";document.body.className=a?"":"q";a?admin():joinView()}
addEventListener("hashchange",route);route();

function joinView(){
 const em=[["📚","Literature"],["🎬","Movies"],["🧑‍🔬","Science"],["🏏","Sports"],["🧑‍💼","Business"],["🧑‍🚀","Space"],["🌍","World"],["🏛️","History"],["💡","Inventions"],["🏆","Champions"]];
 app.innerHTML=`<div class="hd"><i class="l">🏆</i><i class="r">🎓</i><u style="top:6px;left:46%">✦</u><u style="bottom:6px;left:12%;animation-delay:.7s">✦</u><u style="bottom:8px;right:14%;animation-delay:1.3s">✦</u><small>✦ ${esc(TXT.title1)} ✦</small><span>${esc(TXT.title2)}</span></div>
 <div class="bub">${em.map(([e,t],k)=>`<span class="fb" style="animation-delay:${k*.3}s"><b>${e}</b><small>${t}</small></span>`).join("")}</div>
 <p class="tg">${esc(TXT.tagline)}</p>
 <div class="card cmp"><h3>${esc(TXT.formTitle)}</h3>
 <input id="n" placeholder="Your name"><div class="row3"><input id="c" placeholder="Cluster"><input id="bl" placeholder="Building"><input id="f" placeholder="Flat"></div>
 <p class="e" id="err" style="margin:0"></p><button id="go" style="width:100%;font-size:18px">${esc(TXT.button)}</button></div>`;
 api("status").then(s=>{const t=document.querySelector(".tg");if(t)t.textContent=s.live?"🟢 "+s.live.name+" is live · "+TXT.tagline:"⏳ No quiz is live right now"}).catch(()=>{});
 document.getElementById("go").onclick=async()=>{
  try{const d=await post("join",{name:n.value,cluster:c.value,building:bl.value,flat:f.value});play(d)}catch(e){err.textContent=e.message}};
}
function play(d){
 const end=Date.now()+d.remaining*1000,Q=d.questions,ans={};let i=0,sent=false;
 if(!Q.length){app.innerHTML=`<div class="card">No questions yet. Please check back soon.</div>`;return}
 const $=x=>document.getElementById(x);
 const submit=async()=>{if(sent)return;sent=true;clearInterval(iv);
  try{await post("submit",{key:d.key,answers:ans});tm.hidden=true;
   app.innerHTML=`<div class="card" style="text-align:center"><div class="trophy">🏆</div><h2>Thank you!</h2><p>Your answers have been submitted. Results will be announced by the organiser.</p></div>`;scrollTo(0,0)}
  catch(e){sent=false;$("err").textContent=e.message}};
 const show=()=>{const q=Q[i],last=i===Q.length-1;
  app.innerHTML=`<div class="card"><div class="m">Question ${i+1} of ${Q.length}</div><div class="bar"><i style="width:${(i+1)/Q.length*100}%"></i></div>
  <h3>${esc(q.text)}</h3>${media(q)}`+
  q.options.map((o,j)=>`<label class="o"><input type="radio" name="o" value="${j}" ${ans[q.id]===j?"checked":""}> ${esc(o)}</label>`).join("")+
  `<p class="e" id="err"></p><div class="nav"><button class="s" id="bk" ${i?"":"disabled"}>← Back</button>`+
  (last?`<button class="g" id="sub">Submit ✔</button>`:`<button id="nx">Next →</button>`)+`</div></div>`;
  app.querySelectorAll("input[name=o]").forEach(x=>x.onchange=()=>ans[q.id]=+x.value);
  $("bk").onclick=()=>{i--;show()};
  if(last)$("sub").onclick=()=>{const u=Q.length-Object.keys(ans).length;
   if(confirm((u?u+" question(s) unanswered. ":"")+"Submit now? You can't change answers later."))submit()};
  else $("nx").onclick=()=>{i++;show()};
  scrollTo(0,0)};
 tm.hidden=false;const tick=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));tm.textContent="⏱ "+mmss(r);if(r<=0)submit()};
 const iv=setInterval(tick,1000);tick();show();
}

let cur=null;
async function admin(sel){
 if(typeof sel==="string")cur=sel;
 if(!sessionStorage.pw){const p=prompt("Admin password");if(!p){location.hash="";return}sessionStorage.pw=p}
 let o;try{o=await api("admin/overview"+(cur?"?quiz="+cur:""),{},1)}catch(e){delete sessionStorage.pw;app.innerHTML=`<div class="card e">${esc(e.message)} <button onclick="admin()">Retry</button></div>`;return}
 cur=o.qid;const Q=o.quizzes.find(x=>x.id===cur);
 const head=`<div class="card"><h2>Admin</h2><b>Round:</b> <select id="sel" onchange="admin(this.value)">${o.quizzes.map(x=>`<option value="${x.id}" ${x.id===cur?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
 <button onclick="newQ()">＋ New round</button></div>`;
 if(!Q){app.innerHTML=head+`<div class="card m">No rounds yet. Click "New round" to create your first quiz (e.g. Round 1).</div>`;return}
 const T=o.questions.length,st=Q.status,Z=o.quizzes;
 const win=o.overall[0];
 app.innerHTML=head+`<div class="card"><h3>${esc(Q.name)}</h3><p>Status: <b>${st==="live"?"🟢 LIVE":st==="closed"?"🔴 CLOSED":"⚪ Not started"}</b> · ${T} questions · ${o.done.length} submitted · ${o.pending.length} in progress</p>
 ${st!=="live"?`<button class="g" onclick="setS('live')">Start live quiz</button>`:`<button class="d" onclick="setS('closed')">Close quiz</button>`}
 <button class="s" onclick="admin()">Refresh</button> <button class="s" onclick="resetAll()">Reset this round</button> <button class="d" onclick="delQuiz()">Delete round</button>
 <p class="m">Only one round can be live at a time. Starting a round closes any other live round.</p></div>
 <div class="card"><h3>Add question to ${esc(Q.name)}</h3><textarea id="qt" placeholder="Question text"></textarea>
 <label class="m">Optional picture or video (max 4 MB)</label><input type="file" id="qf" accept="image/*,video/*">
 ${[0,1,2,3].map(i=>`<label class="o"><input type="radio" name="cor" value="${i}" ${i?"":"checked"}><input class="op" placeholder="Option ${i+1}" style="margin:0"></label>`).join("")}
 <p class="m">Select the radio next to the correct option.</p><p class="e" id="err"></p><button onclick="addQ()">Add question</button></div>
 <div class="card"><h3>Questions</h3>${o.questions.map((q,i)=>`<div style="border-bottom:1px solid var(--b);padding:8px 0"><b>${i+1}. ${esc(q.text)}</b>${media(q)}
 <div class="m">${q.options.map((x,j)=>(j===q.correct?"✅ ":"• ")+esc(x)).join("<br>")}</div><button class="d" onclick="delQ('${q.id}')">Delete</button></div>`).join("")||"<p class=m>None yet</p>"}</div>
 <div class="card"><h3>${esc(Q.name)} leaderboard</h3><div class="tw"><table><tr><th>#</th><th>Name</th><th>Cluster</th><th>Bldg</th><th>Flat</th><th>Score</th><th>Time</th></tr>
 ${o.done.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.cluster)}</td><td>${esc(p.building)}</td><td>${esc(p.flat)}</td><td>${p.score}/${T}</td><td>${mmss(p.time)}</td></tr>`).join("")}
 ${o.pending.map(p=>`<tr class="m"><td>–</td><td>${esc(p.name)}</td><td>${esc(p.cluster)}</td><td>${esc(p.building)}</td><td>${esc(p.flat)}</td><td colspan=2>not submitted</td></tr>`).join("")}</table></div></div>
 <div class="card"><h3>🏆 Overall league standings</h3>${win?`<p style="font-size:18px">Leader: <b>${esc(win.name)}</b> (${esc(win.cluster)}, ${esc(win.building)}, ${esc(win.flat)}) with <b>${win.total}</b> points</p>`:"<p class=m>No results yet</p>"}
 <div class="tw"><table><tr><th>#</th><th>Name</th><th>Cluster</th><th>Bldg</th><th>Flat</th>${Z.map(x=>`<th>${esc(x.name)}</th>`).join("")}<th>Total</th><th>Time</th></tr>
 ${o.overall.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.cluster)}</td><td>${esc(p.building)}</td><td>${esc(p.flat)}</td>${Z.map(x=>`<td>${p.by[x.id]??"–"}</td>`).join("")}<td><b>${p.total}</b></td><td>${mmss(p.time)}</td></tr>`).join("")}</table></div>
 <p class="m">Total = sum of scores across all rounds. Ties are broken by the lower total time. A player must use the same name, cluster, building and flat in every round to be counted together.</p></div>`;
}
const newQ=async()=>{const n=prompt("Round name (e.g. Round 1)");if(!n)return;const r=await post("admin/quiz",{name:n},1);admin(r.id)};
const setS=async s=>{if(s==="closed"&&!confirm("Close this quiz? Players can no longer submit."))return;await post("admin/status",{id:cur,status:s},1);admin()};
const resetAll=async()=>{if(confirm("Delete all players of THIS round and set it to not started?")){await post("admin/reset",{quiz:cur},1);admin()}};
const delQuiz=async()=>{if(confirm("Delete this round with its questions and results? Overall totals will change.")){await post("admin/deletequiz",{id:cur},1);cur=null;admin()}};
const delQ=async id=>{if(confirm("Delete question?")){await api(`admin/question?quiz=${cur}&id=${id}`,{method:"DELETE"},1);admin()}};
async function addQ(){
 const options=[...document.querySelectorAll(".op")].map(x=>x.value.trim()),f=qf.files[0],text=qt.value.trim();
 if(options.some(x=>!x))return err.textContent="Fill all 4 options.";
 if(!text&&!f)return err.textContent="Add question text or a file.";
 if(f&&f.size>4e6)return err.textContent="File too large (max 4 MB).";
 const b={quiz:cur,text,options,correct:+document.querySelector('input[name="cor"]:checked').value};
 if(f)b.media={type:f.type,data:await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)})};
 try{await post("admin/question",b,1);admin()}catch(e){err.textContent=e.message}
}
</script></body></html>
